# Blueprint: https://dashboard.render.com/blueprints
# After deploy, set GEMINI_API_KEY and CORS_ORIGIN on the API,
# VITE_API_URL on the static site, then seed: npx tsx prisma/seed.ts

databases:
  - name: ledgerly-db
    databaseName: ledgerly
    user: ledgerly
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: ledgerly-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString

  - type: web
    name: ledgerly-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ledgerly-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
